<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve one action</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Approve one action</h1>
      <p class="muted">
        This link approves exactly one prepared action. It cannot execute anything: sending or
        submitting still happens on the host with <code>pw action execute</code>.
      </p>
    </header>
    <main>
      <p id="link-status" class="muted">checking the link…</p>
      <section id="link-detail" hidden>
        <ul id="action-summary"></ul>
        <h2>Canonical payload</h2>
        <pre id="action-payload"></pre>
        <button id="approve-button" type="button">Approve this exact action</button>
        <p id="approve-status" class="muted"></p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
