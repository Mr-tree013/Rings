<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pair this phone</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Pair this phone</h1>
      <p class="muted">
        Paste the pairing code printed by <code>pw mobile pair</code> on the host. The code is
        single-use and expires in ten minutes.
      </p>
    </header>
    <main>
      <form id="pair-form">
        <input id="pair-code" type="text" inputmode="text" autocomplete="off" placeholder="pairing code" required />
        <button type="submit">Pair</button>
      </form>
      <p id="pair-status" class="muted"></p>
      <p class="muted small">
        The code is sent once, in this form, to the host on your local network. It is never put in
        the page URL and never written to a log.
      </p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
