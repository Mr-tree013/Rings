[project]
name = "growing-assistant"
version = "1.3.1"
description = "A personal assistant that grows: mail, personal knowledge, eHall errands and mobile approval in one auditable loop."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Mr-tree013", email = "2170532007@qq.com" }]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pypdf>=6.19.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "playwright>=1.63.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "mcp>=2,<3",
    "prompt-toolkit>=3.0.51,<4",
]

[project.scripts]
pw = "assistant.cli:main"
rings = "assistant.cli_chat:main"
assistantd = "assistant.daemon:main"
growing-assistant-mcp = "assistant.adapters.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.hatch.build.targets.wheel.force-include]
# The migration files are not Python, so they are not picked up by `packages` — and a wheel without
# them cannot migrate a runtime at all (ADR-0032 §16). The repository's `migrations/` directory stays
# the single source of truth; the build copies it into the package.
"migrations" = "assistant/migrations"

[tool.hatch.build.targets.sdist]
include = [
    "/src/assistant",
    "/migrations",
    "/docs",
    "/tests",
    "/README.md",
    "/README_en.md",
    "/CHANGELOG.md",
    "/AGENTS.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The Tree conversation surface answers the user in Chinese, so fullwidth punctuation is
# intentional wording rather than an ambiguous-character slip.
"src/assistant/application/conversation_capabilities/handlers.py" = ["RUF001"]
"src/assistant/application/conversation_context.py" = ["RUF001"]
"src/assistant/application/conversation_interpreter.py" = ["RUF001"]
"src/assistant/application/conversation_render.py" = ["RUF001"]
"src/assistant/application/conversation_service.py" = ["RUF001"]
# The deterministic recipient resolver answers in Chinese when it has to ask a question.
"src/assistant/application/recipient_resolution.py" = ["RUF001"]
"src/assistant/application/conversational_facts.py" = ["RUF001"]
"src/assistant/application/today_brief.py" = ["RUF001"]
# The attention projector writes the product's own Chinese inbox wording, and the prompt that
# asks a user to clarify which reminder they meant.
"src/assistant/application/attention.py" = ["RUF001"]
# The mail settings service answers in Chinese when it explains a restart or an invalid field.
"src/assistant/application/mail_account_settings.py" = ["RUF001"]
# The planning preferences service reports the resulting capacity in the user's words.
"src/assistant/application/planning_preferences_service.py" = ["RUF001"]
"src/assistant/application/contacts.py" = ["RUF001"]
"src/assistant/domain/conversation_review.py" = ["RUF001"]
"src/assistant/cli_chat.py" = ["RUF001"]
# The conversation tests speak the same Chinese the conversation surface answers in.
"tests/integration/test_conversation_mail.py" = ["RUF001"]
"tests/integration/test_conversation_recurring.py" = ["RUF001"]
"tests/integration/test_conversation_facts.py" = ["RUF001"]
"tests/integration/test_today_brief.py" = ["RUF001"]
"tests/integration/test_conversation_attention.py" = ["RUF001"]
"tests/integration/test_planning_preferences.py" = ["RUF001"]
"tests/integration/test_conversation_outbound_mail.py" = ["RUF001"]
# The conversational eHall tests speak the same Chinese the certificate surface answers in.
"tests/integration/test_conversation_ehall.py" = ["RUF001"]
# The v1.3 backup tests seed the same Chinese sentence a user would have typed.
"tests/integration/test_backup_v1_3_state.py" = ["RUF001"]
# The v1.3 surface-language sweep types and reads the same Chinese the product answers in.
"tests/integration/test_v1_3_surface_language.py" = ["RUF001"]
# The v1.3 acceptance transcript types the same Chinese a person types.
"tests/acceptance/test_v1_3_capability_flow.py" = ["RUF001"]
"tests/integration/test_new_mail_send.py" = ["RUF001"]
"tests/integration/test_conversation_runtime.py" = ["RUF001"]
"tests/unit/test_cli_chat.py" = ["RUF001"]
"tests/unit/test_cli_chat_mail.py" = ["RUF001"]
"tests/acceptance/test_tree_real_usage.py" = ["RUF001"]
"tests/acceptance/test_tree_new_mail.py" = ["RUF001"]
"tests/acceptance/test_v1_1_conversation.py" = ["RUF001", "RUF003"]
"tests/unit/test_conversation_domain.py" = ["RUF001"]
"tests/unit/test_conversation_recurring_intent.py" = ["RUF001"]
"tests/unit/test_recipient_resolution.py" = ["RUF001"]
"tests/unit/test_conversational_facts.py" = ["RUF001"]
"tests/unit/test_conversation_reliability.py" = ["RUF001"]
# The terminal editor tests type the same Chinese, punctuation and mail addresses a user does.
"tests/unit/test_conversation_terminal.py" = ["RUF001"]
# The confirmation-group tests speak the same Chinese schedule the runtime answers in.
"tests/integration/test_conversation_confirmation_groups.py" = ["RUF001"]
# The browser-chat tests quote the same Chinese the chat surface shows and a user would type.
"tests/integration/test_chat_cards.py" = ["RUF001"]
"tests/integration/test_chat_queue.py" = ["RUF001"]
"tests/integration/test_chat_web.py" = ["RUF001"]
"tests/integration/test_chat_integrity_and_backup.py" = ["RUF001"]
"tests/support/chat.py" = ["RUF001"]
"tests/integration/test_conversation_request_store.py" = ["RUF001"]
# The browser acceptance types the same Chinese a person types into the composer.
"tests/e2e/test_chat_browser.py" = ["RUF001"]
# The confirmation cards a browser shows are written in the same Chinese, with the same fullwidth
# punctuation, as the terminal renderer they are the equivalent of.
"src/assistant/application/conversation_cards.py" = ["RUF001"]
# The browser chat surface's own read model answers in the same Chinese.
"src/assistant/application/conversation_chat.py" = ["RUF001"]
# The chat adapter answers with the same product sentences the rest of the surface uses.
"src/assistant/adapters/web/chat.py" = ["RUF001"]
# The v1.1.1 acceptance test replays the real transcript verbatim.
"tests/acceptance/test_v1_1_1_hotfix.py" = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
markers = [
    # The browser acceptance needs a downloaded Chromium; the rest of the suite never does.
    "e2e: an end-to-end acceptance test that drives a real browser",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    # A warning nobody chose is a defect, so warnings are errors. The one exception is an upstream
    # deprecation inside Starlette's test client, raised while that module is imported and belonging
    # to a dependency rather than to this project. It is named narrowly instead of ignored wholesale.
    "error",
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["assistant"]
