[project]
name = "growing-assistant"
version = "0.1.0"
description = "A personal assistant that grows: mail, personal knowledge, eHall errands and mobile approval in one auditable loop."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Mr-tree013", email = "2170532007@qq.com" }]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
pw = "assistant.cli:main"
assistantd = "assistant.daemon:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["assistant"]
